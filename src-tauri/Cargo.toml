[package]
name = "multidown"
version = "0.2.0"
description = "Multidown - 对标 IDM 的跨平台下载工具"
edition = "2021"
# 真实下限由依赖决定：tauri 2.x 要求 >= 1.77.2，librqbit 9.x（edition 2024 + let chains）
# 要求 >= 1.88。librqbit 未声明 rust-version，所以这里不写对会得到编译报错而不是解析错误。
rust-version = "1.88"
license = "MIT"

[lib]
name = "multidown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
parking_lot = "0.12"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
# deep-link feature：二次启动时把深链参数转发给 deep-link 插件
# （没有它，Windows/Linux 上"应用已运行时点击 multidown:// 链接"不会触发任何行为）
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt-multi-thread", "net", "macros", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
bytes = "1"
urlencoding = "2"
url = "2"
futures-util = "0.3"
arboard = "3"
opener = "0.7"
dirs = "5"
zip = "0.6"
walkdir = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

# ── BitTorrent 引擎（磁力链接 / 种子文件）─────────────────────────────
# default-features = false 避免引入 http-api(axum) / webui；Api facade 未被 feature 门控。
# default-tls 与项目现有 reqwest 0.12 的 native-tls 栈一致，不会多引入一个 TLS 后端。
librqbit = { version = "9.0.1", default-features = false, features = ["default-tls"] }
anyhow = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# macOS 磁力链接默认程序：LaunchServices FFI（core-foundation 已在 tauri 依赖树中）
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 降低 dev 编译时内存占用，避免 rustc/LLVM OOM（内存不足时可启用）
[profile.dev]
codegen-units = 1
