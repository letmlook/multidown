name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ''
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build browser extension
        run: npm run build:extension

      - name: Verify browser extension identity
        run: npm run test:extension

      - name: Check native messaging host
        working-directory: integration/native-host
        run: cargo clippy --all-targets -- -D warnings

      - name: Run app unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Run strict app Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build native messaging host
        working-directory: integration/native-host
        shell: bash
        run: |
          ARGS=""
          if [ -n "$NATIVE_TARGET" ]; then ARGS="--target $NATIVE_TARGET"; fi
          cargo build --release $ARGS
          BIN="target/$NATIVE_TARGET/release/multidown-native-host"
          DEST="target/release/multidown-native-host"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="${BIN}.exe"
            DEST="${DEST}.exe"
          fi
          # 统一复制到各平台 Tauri 配置声明的资源路径
          mkdir -p target/release
          test -f "$BIN"
          cp "$BIN" "$DEST"
          test -f "$DEST"
        env:
          NATIVE_TARGET: ${{ matrix.target }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'MultiDown v__VERSION__'
          releaseBody: |
            ## 下载安装包

            ### Windows
            - `MultiDown___VERSION___x64-setup.exe` - Windows 安装程序
            - `MultiDown___VERSION___x64_en-US.msi` - Windows MSI 安装包

            ### macOS
            - `MultiDown___VERSION___aarch64.dmg` - Apple Silicon (M1/M2/M3)
            - `MultiDown___VERSION___x64.dmg` - Intel Mac
            - `MultiDown_aarch64.app.tar.gz` / `MultiDown_x64.app.tar.gz` - 应用归档

            ### Linux
            - `MultiDown___VERSION___amd64.deb` - Debian/Ubuntu
            - `MultiDown-__VERSION__-1.x86_64.rpm` - Fedora/RHEL
            - `MultiDown___VERSION___amd64.AppImage` - AppImage 通用版

            ## 更新内容
            查看 [CHANGELOG.md](../../CHANGELOG.md) 了解详细更新内容。

          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
