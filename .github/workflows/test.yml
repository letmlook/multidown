name: Test Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-format:
    name: Rust formatting
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # No workflow ran `cargo fmt` before, so drift accumulated unnoticed:
      # `integration/native-protocol` carried ~109 lines of it. That crate was
      # reformatted (mechanical, no behaviour change) in the same commit that added
      # this gate — the check could not be added before the reformat.
      - name: Check shared protocol formatting
        working-directory: integration/native-protocol
        run: cargo fmt --all --check

      - name: Check native messaging host formatting
        working-directory: integration/native-host
        run: cargo fmt --all --check

      - name: Check application formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

  msrv:
    name: Declared MSRV (Rust 1.88)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Same prerequisites as the Ubuntu leg of `test-tauri`, from the same shared
      # action so the two lists cannot drift apart silently.
      - name: Install system dependencies
        uses: ./.github/actions/install-linux-build-deps

      - name: Install dependencies
        run: npm ci

      # `tauri-build` declares rerun-if-changed on the frontend bundles and reads
      # `frontendDist`, so they must exist before cargo is invoked.
      - name: Build frontend and extension
        run: npm run build:all

      - name: Install the declared MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      # `rust-version` in src-tauri/Cargo.toml is the floor this project promises, and
      # nothing enforced it: the matrix job installs `stable`, so a 1.88-breaking change
      # (ours or a dependency's) stayed green. `--locked` keeps the committed
      # Cargo.lock, so this fails on a new requirement rather than on a fresh resolve.
      - name: Check application against the declared MSRV
        working-directory: src-tauri
        run: cargo +1.88.0 check --locked --all-targets --features integration-tests

  test-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/install-linux-build-deps

      - name: Install dependencies
        run: npm ci

      - name: Check documentation
        run: npm run docs:check

      - name: Run frontend tests
        run: npm run test:run

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build browser extension
        run: npm run build:extension

      - name: Verify browser extension identity
        run: npm run test:extension

      # `integration/native-protocol` is the shared wire definition for the extension,
      # the Native Host and the desktop app. It is not a workspace member (the repo has
      # no root Cargo.toml), so it needs its own explicit step or its tests never run.
      - name: Run shared protocol tests
        working-directory: integration/native-protocol
        run: cargo test

      - name: Check strict shared protocol Clippy
        working-directory: integration/native-protocol
        run: cargo clippy --all-targets -- -D warnings

      # Previously only Clippy ran here: the host's 10 unit tests and the 10 framed
      # round-trip integration tests were never executed by CI.
      - name: Run native messaging host tests
        working-directory: integration/native-host
        run: cargo test

      - name: Check strict native messaging host Clippy
        working-directory: integration/native-host
        run: cargo clippy --all-targets -- -D warnings

      - name: Build native messaging host resource
        working-directory: integration/native-host
        run: cargo build --release

      # GAP 1 的失败模式会从后门回来：`--features integration-tests` 只是一个裸
      # flag，谁以后把它删掉，三个平台都会全绿而集成覆盖为零——而 required-features
      # 的语义是"静默跳过并报告成功"，不会留下任何失败痕迹。
      #
      # 所以在真正跑测试**之前**先证明这两个目标确实被编译并登记了。
      # 注意 `cargo test -- --list` 打印的是**测试名**、不带 target 标签，所以用两个
      # 目标各自独有的测试名来判定；`--list` 只枚举不执行。
      - name: Guard that the integration targets must actually run
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          listed="$(cargo test --features integration-tests -- --list)"
          echo "$listed"
          for test_name in \
            interrupted_range_transfer_resumes_to_the_exact_bytes_without_duplicate_ranges \
            active_restart_reattaches_the_session_with_the_persisted_file_selection; do
            if ! grep -qF "$test_name" <<<"$listed"; then
              echo "::error::$test_name 不在 --list 输出中：--features integration-tests 可能已被删除，集成覆盖为 0"
              exit 1
            fi
          done
          echo "集成目标已确认在测试清单中"

      # `--features integration-tests` is mandatory, not optional: both `[[test]]`
      # targets in src-tauri/Cargo.toml declare `required-features`, so a plain
      # `cargo test` silently SKIPS them and still reports success. The step above is
      # the enforcement; the flag below is the thing being enforced.
      #
      # On Windows this step only runs because src-tauri/build.rs now links a Common
      # Controls v6 manifest into every unit of the package. tauri-build links the same
      # manifest, but with `cargo:rustc-link-arg-bins`, which Cargo applies to bin and
      # `tests/*.rs` targets only — the `cargo test --lib` binary got none, bound
      # `comctl32` to the legacy v5, and died before `main` with
      # 0xC0000139 (STATUS_ENTRYPOINT_NOT_FOUND) on `TaskDialogIndirect`.
      #
      # `--no-fail-fast` so one failing target does not hide the others: without it the
      # known Windows path-assertion failures below stop the run before the two
      # integration targets are ever executed.
      #
      # Known failure on windows-latest only: 4 pre-existing assertions in
      # `engine::scheduler::tests` (POSIX path separators, symlink escape, read-only
      # directory) whose expectations do not hold on Windows. Not a regression; fixing
      # them is a separate task that has to edit src-tauri/src/**.
      - name: Run application unit and integration tests
        working-directory: src-tauri
        run: cargo test --no-fail-fast --features integration-tests

      - name: Check strict app Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --features integration-tests -- -D warnings

      - name: Build Tauri
        run: npm run tauri -- build
