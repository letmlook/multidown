<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multidown 下载助手</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a2e;
      --bg-glass: rgba(26, 26, 46, 0.7);
      --neon-cyan: #00f5ff;
      --neon-blue: #0080ff;
      --neon-pink: #ff00ff;
      --neon-purple: #b829ff;
      --text-primary: #ffffff;
      --text-secondary: #a0a0b0;
      --text-muted: #606070;
      --status-ready: #00ff88;
      --status-error: #ff3366;
      --status-checking: #ffaa00;
      --border-glass: rgba(255, 255, 255, 0.08);
      --shadow-glow: 0 0 20px rgba(0, 245, 255, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      min-height: 420px;
      font-family: 'Outfit', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
      padding: 16px 18px;
      border-bottom: 1px solid var(--border-glass);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(0, 245, 255, 0.08) 0%, transparent 70%);
      border-radius: 50%;
    }
    .header-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title .logo {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    /* Status bar */
    .status-bar {
      padding: 10px 18px;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      border-bottom: 1px solid var(--border-glass);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--status-checking);
      box-shadow: 0 0 6px currentColor;
      transition: all 0.3s;
    }
    .status-dot.ready { background: var(--status-ready); box-shadow: 0 0 6px var(--status-ready); }
    .status-dot.error { background: var(--status-error); box-shadow: 0 0 6px var(--status-error); }
    .status-text { color: var(--text-secondary); }
    .status-text.ready { color: var(--status-ready); }
    .status-text.error { color: var(--status-error); }

    /* Main content */
    .content {
      padding: 16px 18px;
    }

    /* Quick download section */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .url-input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .url-input {
      flex: 1;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .url-input::placeholder { color: var(--text-muted); }
    .url-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 0 2px rgba(0, 245, 255, 0.15);
    }
    .btn-download {
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      color: #000;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      white-space: nowrap;
    }
    .btn-download:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-download:active { transform: translateY(0); }
    .btn-download:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border-glass);
      margin: 14px 0;
    }

    /* Media detection section */
    .media-section {
      margin-bottom: 14px;
    }
    .media-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg-secondary);
      border-radius: 8px;
      margin-bottom: 6px;
      border: 1px solid var(--border-glass);
      transition: border-color 0.2s;
    }
    .media-item:hover { border-color: rgba(0, 245, 255, 0.2); }
    .media-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .media-icon.video { background: rgba(0, 245, 255, 0.15); color: var(--neon-cyan); }
    .media-icon.audio { background: rgba(184, 41, 255, 0.15); color: var(--neon-purple); }
    .media-icon.image { background: rgba(255, 0, 255, 0.15); color: var(--neon-pink); }
    .media-info { flex: 1; min-width: 0; }
    .media-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-type {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .btn-media-download {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-glass);
      border-radius: 6px;
      padding: 5px 10px;
      color: var(--neon-cyan);
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-media-download:hover {
      background: rgba(0, 245, 255, 0.1);
      border-color: var(--neon-cyan);
    }
    .no-media {
      text-align: center;
      padding: 16px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .no-media .icon { font-size: 24px; margin-bottom: 6px; }

    /* Footer actions */
    .footer {
      padding: 12px 18px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-hint {
      font-size: 11px;
      color: var(--text-muted);
    }
    .footer-actions {
      display: flex;
      gap: 6px;
    }
    .btn-icon {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-glass);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-icon:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }
    .version {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 60px;
      left: 18px;
      right: 18px;
      background: var(--bg-tertiary);
      border: 1px solid var(--neon-cyan);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--neon-cyan);
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      z-index: 100;
      text-align: center;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { border-color: var(--status-error); color: var(--status-error); }
    .toast.success { border-color: var(--status-ready); color: var(--status-ready); }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <div class="logo">M</div>
      Multidown 下载助手
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">检查连接...</span>
  </div>

  <div class="content">
    <div class="section-label">快速下载</div>
    <div class="url-input-group">
      <input type="text" class="url-input" id="urlInput" placeholder="粘贴下载链接..." />
      <button class="btn-download" id="btnDownload">下载</button>
    </div>

    <div class="divider"></div>

    <div class="section-label">页面媒体</div>
    <div class="media-section" id="mediaSection">
      <div class="no-media" id="noMedia">
        <div class="icon">🔍</div>
        <div>正在检测页面媒体...</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span class="footer-hint">右键页面可下载视频/音频</span>
    <div class="footer-actions">
      <button class="btn-icon" id="btnLogs" title="导出日志">📋 日志</button>
      <button class="btn-icon" id="btnOpenApp" title="打开 Multidown">⚡ 打开应用</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
